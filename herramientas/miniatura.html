<!doctype html>
<!--
  Miniatura para redes (Open Graph) de Ciudades(In)Posibles: 1200 × 630.
  Reproduce la portada: titular en crema sobre negro, «co-crear» resaltado
  y el mosaico con recorte circular.

  Para regenerar public/assets/img/og.png (desde la raíz del repositorio):
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
      --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1200,630 --virtual-time-budget=3000 \
      --screenshot=public/assets/img/og.png herramientas/miniatura.html
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Miniatura Ciudades(In)Posibles</title>
<style>
@font-face {
  font-family: "Bricolage Grotesque";
  src: url("../public/assets/fonts/bricolage-var.woff2") format("woff2");
  font-weight: 200 800;
  font-stretch: 75% 100%;
}
@font-face {
  font-family: "IBM Plex Mono";
  src: url("../public/assets/fonts/plex-mono-500.woff2") format("woff2");
  font-weight: 500;
}
:root {
  --calle: #0b0b0c;
  --crema: #ffffbf;
  --tinta-2: #c9c9a6;
  --amarillo: #fee08b;
}
* { margin: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
  background: var(--calle);
  color: var(--crema);
  font-family: "Bricolage Grotesque", sans-serif;
  position: relative;
}
.texto {
  position: absolute;
  left: 72px;
  top: 0;
  bottom: 0;
  width: 540px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 32px;
}
.mono {
  font-family: "IBM Plex Mono", monospace;
  font-weight: 500;
  font-size: 22px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.mono::before {
  content: "";
  display: inline-block;
  width: 0.75em;
  height: 0.75em;
  margin-right: 0.6em;
  background: var(--amarillo);
  vertical-align: -0.02em;
}
h1 {
  font-size: 84px;
  font-weight: 800;
  font-stretch: 75%;
  line-height: 0.92;
  letter-spacing: -0.015em;
}
.resalte {
  display: inline-block;
  background: var(--amarillo);
  color: var(--calle);
  line-height: 0.76;
  padding: 0.06em 0.1em 0.08em;
  vertical-align: 0.02em;
}
.dominio {
  font-family: "IBM Plex Mono", monospace;
  font-weight: 500;
  font-size: 20px;
  color: var(--tinta-2);
}
.mosaico {
  position: absolute;
  right: 64px;
  top: 50%;
  width: 500px;
  height: 500px;
  transform: translateY(-50%);
}
</style>
</head>
<body>
  <div class="texto">
    <p class="mono">Ciudades(In)Posibles</p>
    <h1>Nuestro derecho a <span class="resalte">co-crear</span> la&nbsp;ciudad</h1>
    <p class="dominio">ciudadesinposibles.net</p>
  </div>
  <img class="mosaico" src="../public/assets/img/mosaico-portada.svg" alt="">
</body>
</html>
